# ---------------- Enemy board abilities (used by board AI, see enemies.yaml boardAi.abilities) ----------------
venom_spit:
  name: Venom Spit
  type: Enemy
  mp: 0
  description: Spits venom at a nearby cell.
  board:
    range: lib:range2
    targets: [hero]
    effects:
      - { type: applyStatus, status: lib:poison, chance: 0.5, turns: [2, 3] }

wind_shear:
  name: Wind Shear
  type: Enemy
  mp: 0
  description: A blast of wind that slows its targets.
  board:
    range: lib:range3
    targets: [hero]
    effects:
      - { type: applyStatus, status: lib:slow, chance: 0.6, turns: 2 }

quake:
  name: Quake
  type: Enemy
  mp: 0
  description: Stomps the sand into sucking mud around the target.
  board:
    range: lib:range3
    area: lib:cross1
    targets: [hero]
    effects:
      - { type: fieldEffect, effect: lib:sticky, rounds: 3 }

water_spit:
  name: Water Spit
  type: Enemy
  mp: 0
  description: Soaks the ground around a hero – water conducts lightning.
  board:
    range: lib:range3
    area: lib:square1
    targets: [hero]
    effects:
      - { type: fieldEffect, effect: lib:soaked, rounds: 3 }

zap:
  name: Zap
  type: Enemy
  mp: 0
  description: A bolt on one cell – in water (or on soaked ground) it runs on to the heroes standing in it.
  board:
    range: lib:range3
    targets: [anyCell]
    effects:
      - { type: shock, power: 0.8, reach: 4 }

seed_ring:
  name: Seed Ring
  type: Enemy
  mp: 0
  description: Plants seeds around a hero; a round later brambles wall them in.
  board:
    range: lib:range3
    area: lib:ring1
    targets: [hero]
    effects:
      - { type: fieldEffect, effect: lib:seeds, rounds: 1 }

flame_spit:
  name: Flame Spit
  type: Enemy
  mp: 0
  description: Sets the ground around a hero ablaze.
  board:
    range: lib:range3
    area: lib:cross1
    targets: [hero]
    effects:
      - { type: fieldEffect, effect: lib:burning, rounds: 2 }
