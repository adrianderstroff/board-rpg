# The Grave Toad and its acolytes (§12.7)
bad_breath:
  name: Bad Breath
  type: Enemy
  mp: 0
  battle:
    target: allEnemies
    effects:
      - { type: damage, kind: magical, power: 0.35, base: 4 }
      - { type: applyStatus, status: lib:poison, chance: 0.8 }

swallow:
  name: Swallow
  type: Enemy
  mp: 0
  description: Gulps a foe down whole, digests it and spits it out two rounds later.
  offensive: true
  battle:
    target: enemy
    effects: []
    swallow: { hp: 0.5, mp: 0.3 }

raise_dead:
  name: Raise Dead
  type: Enemy
  mp: 0
  description: Pays the grave its due and raises two new acolytes.
  battle:
    target: self
    effects: []
    summon: { enemies: [lib:bone_acolyte, lib:bone_acolyte], cost: 120 }

