  dirt:         { name: Dirt,        frame: 17, fill: 17, walkable: true }
  tiled_roof:   { name: House,       frame: 18, fill: 10, walkable: false }
  oasis_edge:   { name: Grass,       frame: 19, fill: 17, walkable: true }
  # coast, forest, ruins and elf village (demo expansion, §18)
  sea:          { name: Sea,         frame: 20, frames: [20, 21], fill: 17, walkable: false, water: deep }
  cobble:       { name: Quay,        frame: 22, fill: 14, walkable: true }
  deck:         { name: Deck,        frame: 23, fill: 24, walkable: true, flare: 0.3, underlay: sea, bulwark: 0.6 }   # a ship: hull sides lean in over the sea
  forest_floor: { name: Forest Floor, frame: 25, fill: 17, walkable: true }
  flowers:      { name: Flower Bed,  frame: 26, fill: 17, walkable: false, flammable: true, burnsTo: scorched }
  scorched:     { name: Scorched Earth, frame: 27, fill: 17, walkable: true }
  stairs:       { name: Stairs,      frame: 28, fill: 14, walkable: true }
  overgrown_step: { name: Overgrown Step, frame: 29, fill: 14, walkable: false, flammable: true, burnsTo: stairs }
  ruin_floor:   { name: Ruins,       frame: 30, fill: 13, walkable: true }
  ruin_wall:    { name: Ruin Wall,   frame: 31, fill: 31, walkable: false }
  elf_house:    { name: Elf House,   frame: 32, fill: 33, walkable: false }
  moss_stone:   { name: Mossy Path,  frame: 34, fill: 14, walkable: true }
  # interiors (inn, houses, shops)
  doorway:      { name: Doorway,     frame: 35, fill: 15, walkable: true }
  floorboards:  { name: Floor,       frame: 36, fill: 15, walkable: true }
  plaster_wall: { name: Wall,        frame: 37, fill: 37, walkable: false }
  rug:          { name: Rug,         frame: 38, fill: 15, walkable: true }
  # Temple Mountain chapter (§18): water depth (§5.5), mountain, temple, tower, island
  shallow:      { name: Shallow Water, frame: 39, frames: [39, 40], fill: 17, walkable: true, freezable: true, water: shallow }
  deep:         { name: Deep Water,  frame: 41, frames: [41, 42], fill: 17, walkable: false, freezable: true, water: deep }
  cliff:        { name: Cliff,       frame: 43, fill: 43, walkable: false }
  mountain_path: { name: Mountain Path, frame: 44, fill: 43, walkable: true }
  tatami:       { name: Tatami,      frame: 45, fill: 15, walkable: true }
  temple_wall:  { name: Temple,      frame: 46, fill: 46, walkable: false }
  temple_roof:  { name: Temple,      frame: 47, fill: 46, walkable: false }
  jungle_floor: { name: Jungle,      frame: 48, fill: 17, walkable: true }
  tower_floor:  { name: Tower Floor, frame: 49, fill: 50, walkable: true }
  tower_wall:   { name: Tower Wall,  frame: 50, fill: 50, walkable: false }
  dark_floor:   { name: Dark Stone,  frame: 51, fill: 51, walkable: true }
  garden_soil:  { name: Garden Bed,  frame: 52, fill: 17, walkable: true }
  bamboo_wall:  { name: Hut,         frame: 53, fill: 53, walkable: false }
  thatch_roof:  { name: Hut,         frame: 54, fill: 53, walkable: false }
  cave_floor:   { name: Cave,        frame: 55, fill: 56, walkable: true }
  cave_wall:    { name: Cave Wall,   frame: 56, fill: 56, walkable: false }

