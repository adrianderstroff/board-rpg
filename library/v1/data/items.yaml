# Items (§14). category: key | weapon | armor | accessory | consumable | battle | scroll
# equip.stats are flat bonuses (weapon "ATK" = str, "MAG" = mag). equip.kind must match classes.yaml equip lists.
# board.range patterns decide who can be reached on the board (default for potions: own + adjacent cells).

# ---------------- consumables ----------------
potion:
  name: Potion
  category: consumable
  price: 20
  icon: potion
  description: Restores 50 HP.
  battle: { target: ally, effects: [{ type: heal, base: 50 }] }
  board: { range: lib:adjacent, targets: [hero], effects: [{ type: heal, base: 50 }] }

hi_potion:
  name: Hi-Potion
  category: consumable
  price: 80
  icon: hipotion
  description: Restores 150 HP.
  battle: { target: ally, effects: [{ type: heal, base: 150 }] }
  board: { range: lib:adjacent, targets: [hero], effects: [{ type: heal, base: 150 }] }

ether:
  name: Ether
  category: consumable
  price: 60
  icon: ether
  description: Restores 25 MP.
  battle: { target: ally, effects: [{ type: restoreMp, amount: 25 }] }
  board: { range: lib:adjacent, targets: [hero], effects: [{ type: restoreMp, amount: 25 }] }

antidote:
  name: Antidote
  category: consumable
  price: 15
  icon: antidote
  description: Cures poison.
  battle: { target: ally, effects: [{ type: cureStatus, statuses: [lib:poison] }] }
  board: { range: lib:adjacent, targets: [hero], effects: [{ type: cureStatus, statuses: [lib:poison] }] }

eye_drops:
  name: Eye Drops
  category: consumable
  price: 15
  icon: eyedrops
  description: Cures blindness.
  battle: { target: ally, effects: [{ type: cureStatus, statuses: [lib:blind] }] }

remedy:
  name: Remedy
  category: consumable
  price: 100
  icon: remedy
  description: Cures all negative statuses.
  battle: { target: ally, effects: [{ type: cureStatus, allNegative: true }] }
  board: { range: lib:adjacent, targets: [hero], effects: [{ type: cureStatus, allNegative: true }] }

phoenix_feather:
  name: Phoenix Feather
  category: consumable
  price: 150
  icon: feather
  description: Revives a fallen hero with 25% HP.
  battle: { target: fallenAlly, effects: [{ type: revive, percent: 25 }] }
  board: { range: lib:adjacent, targets: [fallen], effects: [{ type: revive, percent: 25 }] }

# ---------------- battle items ----------------
fire_bomb:
  name: Fire Bomb
  category: battle
  price: 60
  icon: bomb
  description: "Battle: 40 fire damage to all enemies. Board: burns an area."
  battle: { target: allEnemies, effects: [{ type: fixedDamage, amount: 40, element: fire }] }
  board: { range: lib:range3, area: lib:diamond1, targets: [anyCell], effects: [{ type: fieldEffect, effect: lib:burning, rounds: 3 }] }

frost_shard:
  name: Frost Shard
  category: battle
  price: 60
  icon: shard
  description: "Battle: 45 ice damage to one enemy. Board: freezes like Ice – water around the target, or a line of 3."
  battle: { target: enemy, effects: [{ type: fixedDamage, amount: 45, element: ice }] }
  board: { range: lib:range3, targets: [anyCell], effects: [{ type: freezeArea, effect: lib:frozen, rounds: 4, size: 3 }] }

sleep_powder:
  name: Sleep Powder
  category: battle
  price: 50
  icon: powder
  description: Puts a target to sleep.
  battle: { target: enemy, effects: [{ type: applyStatus, status: lib:sleep, chance: 0.7, turns: 3 }] }
  board: { range: lib:range2, targets: [enemy, hero], effects: [{ type: applyStatus, status: lib:sleep, chance: 0.7, turns: 2 }] }

glue_pot:
  name: Glue Pot
  category: battle
  price: 40
  icon: glue
  description: "Battle: slows an enemy. Board: sticky cell."
  battle: { target: enemy, effects: [{ type: applyStatus, status: lib:slow, turns: 3 }] }
  board: { range: lib:range3, targets: [anyCell], effects: [{ type: fieldEffect, effect: lib:sticky, rounds: 3 }] }

levitation_draught:
  name: Levitation Draught
  category: battle
  price: 90
  icon: feather
  description: "Float for 5 turns: field effects, traps and ice can't touch you."
  battle: { target: ally, effects: [{ type: applyStatus, status: lib:flying, turns: 5 }] }
  board: { range: lib:adjacent, targets: [hero], effects: [{ type: applyStatus, status: lib:flying, turns: 5 }] }

# ---------------- scrolls ----------------
scroll_venom_mist:
  name: "Scroll: Venom Mist"
  category: scroll
  price: 200
  icon: scroll
  description: Teaches a Magician Venom Mist.
  learn: { ability: lib:venom_mist, classes: [lib:magician] }

scroll_quagmire:
  name: "Scroll: Quagmire"
  category: scroll
  price: 180
  icon: scroll
  description: Teaches a Magician Quagmire.
  learn: { ability: lib:quagmire, classes: [lib:magician] }

scroll_cross_slash:
  name: "Scroll: Cross Slash"
  category: scroll
  price: 250
  icon: scroll
  description: Teaches a Knight Cross Slash.
  learn: { ability: lib:cross_slash, classes: [lib:knight] }

scroll_aura:
  name: "Scroll: Aura"
  category: scroll
  price: 220
  icon: scroll
  description: Teaches a Monk Aura.
  learn: { ability: lib:aura, classes: [lib:monk] }

scroll_ice:
  name: "Scroll: Ice"
  category: scroll
  price: 150
  icon: scroll
  description: Teaches a Magician Ice – freezes even water.
  learn: { ability: lib:ice, classes: [lib:magician] }

# Not sold anywhere in the demo (later shops).
scroll_ice2:
  name: "Scroll: Ice 2"
  category: scroll
  price: 600
  icon: scroll
  description: Teaches a Magician Ice 2 – freezes 5 wide.
  learn: { ability: lib:ice2, classes: [lib:magician] }

scroll_ice3:
  name: "Scroll: Ice 3"
  category: scroll
  price: 1400
  icon: scroll
  description: Teaches a Magician Ice 3 – freezes 7 wide.
  learn: { ability: lib:ice3, classes: [lib:magician] }

snare:
  name: Snare
  category: consumable
  price: 40
  icon: status_stuck
  description: "A defused trap. Board (wild boards only): hide it on an empty cell – enemies stepping on it get hurt and stuck."
  board: { range: lib:range2, targets: [emptyCell], wildOnly: true, effects: [{ type: placePrefab, prefab: lib:snare_trap }] }

# ---------------- key items ----------------
village_charm:
  name: Village Charm
  category: key
  price: 0
  icon: charm
  description: A little clay charm shaped like a sun. Nia lost it.

# ---------------- weapons ----------------
