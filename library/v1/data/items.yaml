  equip: { slot: weapon, kind: claw, stats: { str: 13 } }

tiger_fangs:
  name: Tiger Fangs
  category: weapon
  price: 850
  icon: claw
  description: Fast and fierce.
  equip: { slot: weapon, kind: claw, stats: { str: 18, mag: 2, spd: 1 } }

coral_spear:
