  equip: { slot: weapon, kind: dagger, stats: { str: 6, spd: 1 } }

kris:
  name: Kris
  category: weapon
  price: 400
  icon: dagger
  description: Wavy blade coated in venom.
  equip: { slot: weapon, kind: dagger, stats: { str: 10, spd: 2 }, onHit: { status: lib:poison, chance: 0.25 } }

leather_knuckles:
  name: Leather Knuckles
  category: weapon
  price: 90
  icon: claw
  description: Wrapped fists.
  equip: { slot: weapon, kind: claw, stats: { str: 7 } }

iron_claws:
  name: Iron Claws
  category: weapon
  price: 380
