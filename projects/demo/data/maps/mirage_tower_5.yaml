# Mirage Tower F5 (§18.10): the teams enter the boss room from two sides. The Mirage Djinn guards
# the Token of Foresight; the tower is left through the door behind it.
name: Mirage Tower 5F
kind: wild
chipset: lib:desert
battleback: lib:mirage
music: lib:boss

legend:
  terrain:
    f: tower_floor
    W: tower_wall
    i: ice
    O: doorway
  decor:
    M: mirage_crystal
    U: stairs_up
    o: rubble

