# Temple Mountain (§18.7): climbed in zig-zags – stairs up, along a ledge, stairs up … – to the
# Temple of the Still Sky. A cave half-way up is sealed until the Holy Orb is claimed (§12.7).
# Grid +x = screen down-right, +y = screen down-left. Layers: see sandhollow.yaml.
