spawns:
  from_dunes: { x: 1, y: 24, dir: E }
  from_pond: { x: 12, y: 25, dir: W }
  from_temple: { x: 7, y: 4, dir: S }
  from_cave: { x: 6, y: 14, dir: S }

exits:
  - { x: 0, y: 24, dir: W, to: scorpion_dunes, spawn: from_mountain, label: Scorpion Dunes }
  - { x: 13, y: 25, dir: E, to: reed_pond, spawn: from_mountain, label: Reed Pond }
  - { x: 7, y: 3, dir: N, to: temple, spawn: from_mountain, label: Temple of the Still Sky, door: true }
  - { x: 6, y: 12, dir: N, to: grave_cave, spawn: from_mountain, label: Cave, door: true }

events:

  - id: mountain_sign
    x: 3
    y: 23
    states:
      idle: { decor: sign_post }
    on:
      - { on: interact, options: [{ type: examine, label: Read, dialog: sign_mountain }] }

  - id: pilgrim_1
    x: 6
    y: 19
    states:
      idle: { npc: pilgrim, dir: S, move: wander, wanderRadius: 2 }
    on:
      - { on: interact, options: [{ type: talk, dialog: pilgrim_1 }] }

  - id: pilgrim_2
    x: 9
    y: 15
    states:
      idle: { npc: pilgrim_b, dir: W }
    on:
      - { on: interact, when: { flag: orb_claimed }, options: [{ type: talk, dialog: pilgrim_2_after }] }
      - { on: interact, options: [{ type: talk, dialog: pilgrim_2 }] }

  - id: novice
    x: 9
    y: 6
    states:
      idle: { npc: monk_novice, dir: S, move: wander, wanderRadius: 2 }
    on:
      - { on: interact, options: [{ type: talk, dialog: novice_talk }] }
  # An iron grate seals the cave until the Holy Orb is claimed.
  - id: cave_seal
    x: 6
    y: 13
    states:
      closed: { decor: gate_bars, pass: solid }
      open: { pass: walk }
    on:
      - { on: becomes, when: { flag: orb_claimed }, do: [{ setState: { event: cave_seal, state: open } }] }
      - { on: becomes, when: { all: [{ not: { flag: orb_claimed } }, { state: { event: cave_seal, is: open } }] }, do: [{ setState: { event: cave_seal, state: closed } }] }
on:
  - on: becomes
    when: { always: true }
    do: [{ dialog: mountain_enter }]
    once: true
    onceKey: mountain_intro#0
  - on: becomes
    when: { flag: orb_claimed }
    do: [{ dialog: cave_opened }]
    once: true
    onceKey: cave_hint#1
