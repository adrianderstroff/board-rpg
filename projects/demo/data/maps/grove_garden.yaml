spawns:
  from_isle: { x: 6, y: 10, dir: N }
  from_house: { x: 6, y: 4, dir: S }

exits:
  - { x: 6, y: 11, dir: S, to: verdant_isle, spawn: from_garden, label: Verdant Isle }
  - { x: 6, y: 3, dir: N, to: mora_house, spawn: from_garden, label: Mora's House, door: true }

enemies:
  - { id: king, enemy: lib:pumpkin_king, x: 6, y: 5, dir: S }
  - { id: g_tomato, enemy: lib:tomato, x: 4, y: 6, dir: S }
  - { id: g_lemon, enemy: lib:lemon, x: 8, y: 7, dir: S }
  - { id: g_melon, enemy: lib:watermelon, x: 5, y: 8, dir: S }
  - { id: g_chili, enemy: lib:chili, x: 7, y: 5, dir: S }

events:
  - id: mora_hostage
    x: 9
    y: 3
    states:
      islander: { npc: islander, dir: S }
      nothing: {}
    on:
      - on: becomes
        when: { not: { defeatedAllOn: grove_garden } }
        do: [{ setState: { event: mora_hostage, state: islander } }]
      - on: becomes
        when: { defeatedAllOn: grove_garden }
        do: [{ setState: { event: mora_hostage, state: nothing } }]
      - on: interact
        when: { not: { defeatedAllOn: grove_garden } }
        options: [{ type: talk, dialog: mora_help }]
  - id: mora_door
    x: 6
    y: 3
    states:
      closed: { decor: gate_bars, pass: solid }
      open: { pass: walk }
    on:
      - { on: becomes, when: { defeatedAllOn: grove_garden }, do: [{ setState: { event: mora_door, state: open } }] }
      - { on: becomes, when: { all: [{ not: { defeatedAllOn: grove_garden } }, { state: { event: mora_door, is: open } }] }, do: [{ setState: { event: mora_door, state: closed } }] }
on:
  - on: becomes
    when: { always: true }
    do: [{ dialog: garden_enter }]
    once: true
    onceKey: garden_intro#0
  - on: becomes
    when: { defeatedAllOn: grove_garden }
    do: [{ dialog: garden_won }]
    once: true
    onceKey: garden_won#1
