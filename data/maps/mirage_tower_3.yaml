# Mirage Tower F3 (§18.10): an ice lane slides each team up to a latching plate that opens the
# other team's stairs gate.
name: Mirage Tower 3F
kind: wild
chipset: desert
battleback: mirage
music: mirage

legend:
  terrain:
    f: tower_floor
    W: tower_wall
    i: ice
    O: doorway
  decor:
    M: mirage_crystal
    U: stairs_up
    o: rubble

layers:
  terrain: |
    WWWWWWWWWWWWW
    WfffffWfffffW
    WfffffWfffffW
    WWWiWWWWWiWWW
    WWWiWWWWWiWWW
    WWWiWWWWWiWWW
    WWWiWWWWWiWWW
    WWWiWWWWWiWWW
    WfffffWfffffW
    WfffffWfffffW
    WfffffWfffffW
  height: |
    4444443444444
    4000003000004
    4000003000004
    4330333330334
    4330333330334
    4330333330334
    4330333330334
    4330333330334
    4000003000004
    4000003000004
    4000003000004
  decor: |
    .............
    .U.........U.
    .............
    .............
    .............
    .............
    .............
    .............
    .............
    .....M.M.....
    .............

spawns:
  west: { x: 3, y: 9, dir: N }
  east: { x: 9, y: 9, dir: N }

exits:
  - { x: 1, y: 1, dir: N, to: mirage_tower_4, spawn: west, label: Upstairs, door: true, together: true }
  - { x: 11, y: 1, dir: N, to: mirage_tower_4, spawn: east, label: Upstairs, door: true, together: true }

events:
  - id: f3_intro
    x: 3
    y: 9
    states:
      idle: {}
    on:
      - { on: becomes, when: { always: true }, do: [{ dialog: tower_f3 }], once: true, onceKey: f3_intro#0 }
  - id: west_stairs
    x: 1
    y: 2
    states:
      closed: { decor: gate_bars, pass: solid }
      open: { pass: walk }
    on:
      - { on: becomes, when: { state: { event: east_plate, is: down } }, do: [{ setState: { event: west_stairs, state: open } }] }
      - { on: becomes, when: { all: [{ not: { state: { event: east_plate, is: down } } }, { state: { event: west_stairs, is: open } }] }, do: [{ setState: { event: west_stairs, state: closed } }] }
  - id: east_stairs
    x: 11
    y: 2
    states:
      closed: { decor: gate_bars, pass: solid }
      open: { pass: walk }
    on:
      - { on: becomes, when: { state: { event: west_plate, is: down } }, do: [{ setState: { event: east_stairs, state: open } }] }
      - { on: becomes, when: { all: [{ not: { state: { event: west_plate, is: down } } }, { state: { event: east_stairs, is: open } }] }, do: [{ setState: { event: east_stairs, state: closed } }] }
  - id: west_plate
    x: 3
    y: 2
    states:
      up: { decor: switch_up, pass: walk }
      down: { decor: switch_down, pass: walk }
    on:
      - { on: becomes, when: { heroesOn: { event: west_plate } }, do: [{ setState: { event: west_plate, state: down } }] }
  - id: east_plate
    x: 9
    y: 2
    states:
      up: { decor: switch_up, pass: walk }
      down: { decor: switch_down, pass: walk }
    on:
      - { on: becomes, when: { heroesOn: { event: east_plate } }, do: [{ setState: { event: east_plate, state: down } }] }
