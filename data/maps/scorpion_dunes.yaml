spawns:
  from_village: { x: 1, y: 7, dir: E }
  from_mountain: { x: 16, y: 6, dir: W }
  from_south: { x: 9, y: 12, dir: N }

exits:
  - { x: 0, y: 7, dir: W, to: sandhollow, spawn: from_dunes, label: Sandhollow }
  - { x: 17, y: 6, dir: E, to: temple_mountain, spawn: from_dunes, label: Temple Mountain, enabled: { flag: road_beyond_open } }
  # into the Endless Dunes (§18.10) – where the lost find the Mirage Tower
  - { x: 9, y: 13, dir: S, to: endless_dunes, spawn: north, label: Endless Dunes, enabled: { flag: monks_trial } }

enemies:
  - { id: scorp_a, enemy: sand_scorpion, x: 5, y: 9, dir: E }
  - { id: scorp_pair, enemy: sand_scorpion, party: [sand_scorpion], x: 11, y: 3, dir: S }
  - { id: scorp_b, enemy: sand_scorpion, x: 8, y: 12, dir: N }
  - { id: condor_a, enemy: giant_condor, x: 9, y: 1, dir: S }
  - { id: condor_pair, enemy: giant_condor, party: [giant_condor], x: 14, y: 10, dir: W }
  - { id: emperor, enemy: emperor_scorpion, x: 15, y: 6, dir: W }

events:
  - id: charm_chest
    x: 11
    y: 11
    states:
      chest_closed: { decor: chest_closed }
      chest_open: { decor: chest_open }
    on:
      - on: becomes
        when: { not: { flag: charm_chest_open } }
        do: [{ setState: { event: charm_chest, state: chest_closed } }]
      - on: becomes
        when: { flag: charm_chest_open }
        do: [{ setState: { event: charm_chest, state: chest_open } }]
      - on: interact
        when: { not: { flag: charm_chest_open } }
        options:
          - type: examine
            label: Open
            dialog: chest_charm
            actions: [{ giveItem: village_charm }, { setFlag: charm_chest_open }]

  - id: trader
    x: 9
    y: 11
    states:
      idle: { npc: trader, dir: E }
    on:
      - { on: interact, when: { flag: trader_thanked }, options: [{ type: talk, dialog: trader_after }] }
      - { on: interact, options: [{ type: talk, dialog: trader_help }] }

  - id: enter_hint
    x: 1
    y: 7
    states:
      idle: {}
    on:
      - { on: becomes, when: { always: true }, do: [{ dialog: dunes_enter }], once: true, onceKey: enter_hint#0 }
