# Temple of the Still Sky (§18.8): three monks meditate on cushions; sitting on the free cushion
# facing them starts the conversation. The hidden door behind them opens once the tokens are back.
name: Temple of the Still Sky
kind: peaceful
chipset: desert
battleback: temple
music: temple

legend:
  terrain:
    W: temple_wall
    t: tatami
    f: floorboards
    O: doorway
  decor:
    B: buddha_statue
    I: incense_burner
    L: stone_lantern
    p: pillow

layers:
  terrain: |
    WWWWWWWWOW
    Wttttttttt
    Wttttttttt
    Wttttttttt
    Wttttttttt
    Wttttttttt
    Wttttttttt
    Wfffffffff
    WffffOffff
  overhead: |
    ........W.
    ..........
    ..........
    ..........
    ..........
    ..........
    ..........
    ..........
    ..........
  overheadHeight: |
    ........5.
    ..........
    ..........
    ..........
    ..........
    ..........
    ..........
    ..........
    ..........
  height: |
    5555555505
    5000000000
    5000000000
    5000000000
    5000000000
    5000000000
    5000000000
    5000000000
    5000000000
  decor: |
    ..........
    .L.I.B.I.L
    ..........
    ...p.p.p..
    ..........
    .....p....
    .I........
    ..........
    ..........

spawns:
  from_mountain: { x: 5, y: 7, dir: N }
  from_hall: { x: 8, y: 1, dir: S }

exits:
  - { x: 5, y: 8, dir: S, to: temple_mountain, spawn: from_temple, label: Temple Mountain, door: true }
  - { x: 8, y: 0, dir: N, to: hall_of_fears, spawn: from_temple, label: Hall of Fears, door: true }

gates:
  - { id: hidden_door, x: 8, y: 0, openWhen: { flag: tokens_returned } }

events:
  - id: abbot
    x: 5
    y: 3
    pages:
      - { npc: monk_old, dir: S, dialog: abbot_talk }
  - id: monk_left
    x: 3
    y: 3
    pages:
      - { npc: monk_a, dir: S, dialog: monk_a_talk }
  - id: monk_right
    x: 7
    y: 3
    pages:
      - { npc: monk_b, dir: S, dialog: monk_b_talk }
  # the free cushion facing the monks
  - id: free_cushion
    x: 5
    y: 5
    pages:
      - { trigger: step, once: false, dialog: monks_talk }
