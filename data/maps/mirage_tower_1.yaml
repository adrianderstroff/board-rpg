# Mirage Tower F1 (§18.10, §5.8): the plate holds the east gate open only while someone stands on
# it. Inside, a second plate opens the west gate. Each team climbs its own stairs (§5.3).
name: Mirage Tower 1F
kind: wild
chipset: desert
battleback: mirage
music: mirage

legend:
  terrain:
    f: tower_floor
    W: tower_wall
    i: ice
    O: doorway
  decor:
    M: mirage_crystal
    U: stairs_up
    o: rubble

layers:
  terrain: |
    WWWWWWWWWWWWW
    WfffffWfffffW
    WfffffWfffffW
    WfffffWfffffW
    WfffffWfffffW
    WfffffWfffffW
    WWWfWWWWWfWWW
    WfffffffffffW
    WfffffffffffW
    WfffffffffffW
    WfffffOfffffW
  height: |
    4444444444444
    4000003000004
    4000003000004
    4000003000004
    4000003000004
    4000003000004
    4330333330334
    4000000000004
    4000000000004
    4000000000004
    4000000000004
  decor: |
    .............
    ..U.......U..
    ....o........
    .............
    .............
    .............
    .............
    .............
    .............
    .M.........M.
    .............

spawns:
  start: { x: 6, y: 9, dir: N }

exits:
  - { x: 6, y: 10, dir: S, to: mirage_sands, spawn: from_tower, label: Mirage Sands, door: true }
  - { x: 2, y: 1, dir: N, to: mirage_tower_2, spawn: west, label: Upstairs, door: true, together: true }
  - { x: 10, y: 1, dir: N, to: mirage_tower_2, spawn: east, label: Upstairs, door: true, together: true }

events:
  - id: tower_intro
    x: 6
    y: 9
    pages:
      - { trigger: auto, dialog: tower_enter }
  - id: split_up
    x: 6
    y: 8
    pages:
      - { trigger: none }
      - { when: { flag: tower_split }, trigger: auto, dialog: tower_split_up }
  - id: east_gate
    x: 9
    y: 6
    states:
      closed: { decor: gate_bars, pass: solid }
      open: { pass: walk }
    on:
      - { on: becomes, when: { state: { event: hall_plate, is: down } }, do: [{ setState: { event: east_gate, state: open } }] }
      - { on: becomes, when: { all: [{ not: { state: { event: hall_plate, is: down } } }, { state: { event: east_gate, is: open } }] }, do: [{ setState: { event: east_gate, state: closed } }, { setFlag: tower_split }] }
  - id: west_gate
    x: 3
    y: 6
    states:
      closed: { decor: gate_bars, pass: solid }
      open: { pass: walk }
    on:
      - { on: becomes, when: { state: { event: inner_plate, is: down } }, do: [{ setState: { event: west_gate, state: open } }] }
      - { on: becomes, when: { all: [{ not: { state: { event: inner_plate, is: down } } }, { state: { event: west_gate, is: open } }] }, do: [{ setState: { event: west_gate, state: closed } }] }
  - id: hall_plate
    x: 3
    y: 8
    states:
      up: { decor: switch_up, pass: walk }
      down: { decor: switch_down, pass: walk }
    on:
      - { on: becomes, when: { heroesOn: { event: hall_plate } }, do: [{ setState: { event: hall_plate, state: down } }] }
      - { on: becomes, when: { not: { heroesOn: { event: hall_plate } } }, do: [{ setState: { event: hall_plate, state: up } }] }
  - id: inner_plate
    x: 9
    y: 2
    states:
      up: { decor: switch_up, pass: walk }
      down: { decor: switch_down, pass: walk }
    on:
      - { on: becomes, when: { heroesOn: { event: inner_plate } }, do: [{ setState: { event: inner_plate, state: down } }] }
      - { on: becomes, when: { not: { heroesOn: { event: inner_plate } } }, do: [{ setState: { event: inner_plate, state: up } }] }
