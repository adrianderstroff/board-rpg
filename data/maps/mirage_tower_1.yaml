# Mirage Tower F1 (§18.10, §5.8): the plate holds the east gate open only while someone stands on
# it. Inside, a second plate opens the west gate. Each team climbs its own stairs (§5.3).
name: Mirage Tower 1F
kind: wild
chipset: desert
battleback: mirage
music: mirage

legend:
  terrain:
    f: tower_floor
    W: tower_wall
    i: ice
    O: doorway
  decor:
    M: mirage_crystal
    U: stairs_up
    o: rubble

layers:
  terrain: |
    WWWWWWWWWWWWW
    WfffffWfffffW
    WfffffWfffffW
    WfffffWfffffW
    WfffffWfffffW
    WfffffWfffffW
    WWWfWWWWWfWWW
    WfffffffffffW
    WfffffffffffW
    WfffffffffffW
    WfffffOfffffW
  height: |
    4444444444444
    4000003000004
    4000003000004
    4000003000004
    4000003000004
    4000003000004
    4330333330334
    4000000000004
    4000000000004
    4000000000004
    4000000000004
  decor: |
    .............
    ..U.......U..
    ....o........
    .............
    .............
    .............
    .............
    .............
    .............
    .M.........M.
    .............

spawns:
  start: { x: 6, y: 9, dir: N }

exits:
  - { x: 6, y: 10, dir: S, to: mirage_sands, spawn: from_tower, label: Mirage Sands, door: true }
  - { x: 2, y: 1, dir: N, to: mirage_tower_2, spawn: west, label: Upstairs, door: true, together: true }
  - { x: 10, y: 1, dir: N, to: mirage_tower_2, spawn: east, label: Upstairs, door: true, together: true }

gates:
  - { id: east_gate, x: 9, y: 6, closeFlag: tower_split }
  - { id: west_gate, x: 3, y: 6 }
switches:
  - { id: hall_plate, x: 3, y: 8, opens: [east_gate] }
  - { id: inner_plate, x: 9, y: 2, opens: [west_gate] }

events:
  - id: tower_intro
    x: 6
    y: 9
    pages:
      - { trigger: auto, dialog: tower_enter }
  - id: split_up
    x: 6
    y: 8
    pages:
      - { trigger: none }
      - { when: { flag: tower_split }, trigger: auto, dialog: tower_split_up }
