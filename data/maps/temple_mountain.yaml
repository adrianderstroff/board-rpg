spawns:
  from_dunes: { x: 1, y: 24, dir: E }
  from_pond: { x: 12, y: 25, dir: W }
  from_temple: { x: 7, y: 4, dir: S }
  from_cave: { x: 6, y: 14, dir: S }

exits:
  - { x: 0, y: 24, dir: W, to: scorpion_dunes, spawn: from_mountain, label: Scorpion Dunes }
  - { x: 13, y: 25, dir: E, to: reed_pond, spawn: from_mountain, label: Reed Pond }
  - { x: 7, y: 3, dir: N, to: temple, spawn: from_mountain, label: Temple of the Still Sky, door: true }
  - { x: 6, y: 12, dir: N, to: grave_cave, spawn: from_mountain, label: Cave, door: true }

# An iron grate seals the cave until the Holy Orb is claimed.
gates:
  - { id: cave_seal, x: 6, y: 13, openWhen: { flag: orb_claimed } }

events:
  - id: mountain_intro
    x: 1
    y: 24
    pages:
      - { trigger: auto, dialog: mountain_enter }

  - id: mountain_sign
    x: 3
    y: 23
    pages:
      - decor: sign_post
        interactions:
          - { type: examine, label: Read, dialog: sign_mountain }

  - id: pilgrim_1
    x: 6
    y: 19
    pages:
      - { npc: pilgrim, dir: S, move: wander, wanderRadius: 2, dialog: pilgrim_1 }

  - id: pilgrim_2
    x: 9
    y: 15
    pages:
      - { npc: pilgrim_b, dir: W, dialog: pilgrim_2 }
      - { when: { flag: orb_claimed }, npc: pilgrim_b, dir: W, dialog: pilgrim_2_after }

  - id: novice
    x: 9
    y: 6
    pages:
      - { npc: monk_novice, dir: S, move: wander, wanderRadius: 2, dialog: novice_talk }

  - id: cave_hint
    x: 6
    y: 14
    pages:
      - { trigger: none }
      - { when: { flag: orb_claimed }, trigger: auto, dialog: cave_opened }
