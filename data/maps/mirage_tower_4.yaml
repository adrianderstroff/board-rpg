# Mirage Tower F4 (§18.10): Mirage Phantoms on both sides; the stairs open when all are gone.
name: Mirage Tower 4F
kind: wild
chipset: desert
battleback: mirage
music: mirage

legend:
  terrain:
    f: tower_floor
    W: tower_wall
    i: ice
    O: doorway
  decor:
    M: mirage_crystal
    U: stairs_up
    o: rubble

layers:
  terrain: |
    WWWWWWWWWWWWW
    WfffffWfffffW
    WWWfWWWWWfWWW
    WfffffWfffffW
    WfffffWfffffW
    WfffffWfffffW
    WfffffWfffffW
    WfffffWfffffW
    WfffffWfffffW
    WfffffWfffffW
    WfffffWfffffW
  height: |
    4444443444444
    4000003000004
    4330333330334
    4000003000004
    4000003000004
    4000003000004
    4000003000004
    4000003000004
    4000003000004
    4000003000004
    4000003000004
