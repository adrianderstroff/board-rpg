# Hall of Fears (§18.8): the heroes' fears take shape. When all are beaten the gate to the
# orb chamber opens; the Holy Orb teaches the Monk Holy.
name: Hall of Fears
kind: wild
chipset: desert
battleback: fear
music: fear

legend:
  terrain:
    d: dark_floor
    X: cave_wall
    O: doorway
  decor:
    Z: dark_brazier

layers:
  terrain: |
    XXXXXXXXX
    XXXdddXXX
    XXXdddXXX
    XXXXdXXXX
    XdddddddX
    XdddddddX
    XdddddddX
    XdddddddX
    XdddddddX
    XdddddddX
    XdddddddX
    XXXXOXXXX
  height: |
    444444444
    444000444
    444000444
    444404444
    400000004
    400000004
    400000004
    400000004
    400000004
    400000004
    400000004
    444404444
  decor: |
    .........
    ...Z.Z...
    .........
    .........
    .........
    .Z.....Z.
    .........
    .........
    .........
    .Z.....Z.
    .........
    .........

spawns:
  from_temple: { x: 4, y: 10, dir: N }

exits:
  - { x: 4, y: 11, dir: S, to: temple, spawn: from_hall, label: Temple, door: true }

gates:
  - { id: orb_gate, x: 4, y: 3, openWhen: { defeatedAllOn: hall_of_fears } }

enemies:
  - { id: fear_knight, enemy: shadow_knight, x: 4, y: 5, dir: S }
  - { id: fear_mage, enemy: shadow_mage, x: 2, y: 6, dir: S }
  - { id: fear_thief, enemy: shadow_thief, x: 6, y: 6, dir: S }
  - { id: fear_monk, enemy: shadow_monk, x: 4, y: 7, dir: S }

events:
  - id: fears_intro
    x: 4
    y: 10
    pages:
      - { trigger: auto, dialog: fears_enter }
  - id: fears_beaten
    x: 4
    y: 9
    pages:
      - { trigger: none }
      - { when: { defeatedAllOn: hall_of_fears }, trigger: auto, dialog: fears_gone }
  - id: holy_orb
    x: 4
    y: 1
    pages:
      - decor: pedestal
        interactions:
          - type: examine
            label: Take the orb
            dialog: orb_claim
            actions: [{ giveItem: holy_orb }, { setFlag: orb_claimed }]
      - { when: { flag: orb_claimed }, decor: pedestal, interactions: [{ type: examine, label: Look, dialog: orb_empty }] }
