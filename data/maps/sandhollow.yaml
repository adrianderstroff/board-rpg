# Sandhollow – peaceful desert village (§18).
# Layers are character grids (x = column, y = row). Grid +x = screen down-right, +y = screen down-left.
#   terrain: legend.terrain chars; space or unknown char = hole (no cell)
#   height:  0-9, a-z (10-35) block heights
#   decor:   legend.decor chars, '.' = nothing
name: Sandhollow
kind: peaceful
chipset: desert
battleback: village
music: village

legend:
  terrain:
    s: sand
    r: rock
    p: stone_path
    z: plaza
    g: grass
    w: water
    A: adobe
    W: adobe_window
    D: adobe_door
    O: doorway
  decor:
    P: palm
    W: well
    R: stall_red
    G: stall_green
    U: stall_purple
    x: crate
    b: barrel
    j: pot
    L: lamp_post
    I: inn_sign

layers:
  terrain: |
    rrrrrrrrrrrrrr
    rAAssAAAsAAAsr
    rDWssWOWsWOWsr
    rsspppppppppsr
    rssszzzzzsspsr
    rssszzzzzssppp
    rsspzzzzzpppsr
    psspsssssssssr
    rAApsssssssssr
    rDWpssgggssssr
    rsspsgwwgssssr
    rrrrrggggrrrrr
  # lintels above the doors (the house continues over the doorway)
  overhead: |
    ..............
    ..............
    ......A...A...
  overheadHeight: |
    ..............
    ..............
    ......5...7...
  height: |
    22222222222222
    25500555077702
    25500505070702
    20000000000002
    20001111100002
    20001111100000
    20001111100002
    00000000000002
    25500000000002
    25500000000002
    20000000000002
    22222000022222
  decor: |
    ..............
    ..............
    ..............
    ..............
    .P............
    ......W.......
    ..............
    ......R.G.U...
    ....L.......P.
    ..............
    ....P....P....
    ..............

# INN is painted on the wall above the inn's door, facing the street (only visible from that side).
wallDecor:
  - { x: 10, y: 2, sign: inn, face: S, level: 7 }

spawns:
  start: { x: 3, y: 4, dir: E }
  from_ruins: { x: 1, y: 7, dir: E }
  from_elder: { x: 6, y: 3, dir: S }
  from_inn: { x: 10, y: 3, dir: S }
  from_dunes: { x: 12, y: 5, dir: W }

exits:
  - { x: 0, y: 7, dir: W, to: sunken_ruins, spawn: from_sandhollow, label: Sunken Ruins }
  # doors: stepping into the doorway enters (no arrow, no question)
  - { x: 6, y: 2, dir: N, to: elder_house, spawn: from_town, label: Elder's House, door: true }
  - { x: 10, y: 2, dir: N, to: sandhollow_inn, spawn: from_town, label: The Sleeping Camel, door: true }
  - { x: 13, y: 5, dir: E, to: scorpion_dunes, spawn: from_village, label: Scorpion Dunes, enabled: { flag: gate_open } }

events:
  - id: smith
    x: 6
    y: 8
    pages:
      - npc: smith
        dir: S
        sign: sign_weapon
        interactions:
          - { type: shop, shop: sandhollow_smith, label: Buy/Sell }
          - { type: talk, dialog: smith_talk }

  - id: merchant
    x: 8
    y: 8
    pages:
      - npc: merchant
        dir: S
        sign: sign_item
        interactions:
          - { type: shop, shop: sandhollow_items, label: Buy/Sell }
          - { type: talk, dialog: merchant_talk }

  - id: mage
    x: 10
    y: 8
    pages:
      - npc: mage
        dir: S
        sign: sign_magic
        interactions:
          - { type: shop, shop: sandhollow_magic, label: Buy/Sell }
          - { type: talk, dialog: mage_talk }

  - id: nia
    x: 7
    y: 9
    pages:
      - { npc: child, dir: S, move: wander, wanderRadius: 2, dialog: nia_ask }
      - { when: { questStep: { quest: nias_charm, step: find } }, npc: child, dir: S, move: wander, wanderRadius: 2, dialog: nia_waiting }
      - { when: { item: village_charm }, npc: child, dir: S, move: wander, wanderRadius: 2, dialog: nia_thanks }
      - { when: { questDone: nias_charm }, npc: child, dir: S, move: wander, wanderRadius: 2, dialog: nia_happy }

  - id: villager_1
    x: 3
    y: 6
    pages:
      - { npc: villager_m, dir: E, move: wander, wanderRadius: 3, dialog: villager_1 }

  - id: villager_2
    x: 9
    y: 4
    pages:
      - { npc: villager_f, dir: S, move: wander, wanderRadius: 3, dialog: villager_2 }
      - { when: { questDone: clear_dunes }, npc: villager_f, dir: S, move: wander, wanderRadius: 3, dialog: villager_2_after }

  - id: guard
    x: 12
    y: 6
    pages:
      - { npc: guard, dir: W, dialog: guard_closed }
      - { when: { flag: gate_open }, npc: guard, dir: W, dialog: guard_open }

  - id: sign_east
    x: 12
    y: 4
    pages:
      - decor: sign_post
        interactions:
          - { type: examine, label: Read, dialog: sign_east }

  # Searchable jars and barrels (§18)
  - id: jar_dates
    x: 12
    y: 8
    pages:
      - decor: pot
        interactions:
          - { type: examine, label: Search, dialog: search_dates }

  - id: barrel_water
    x: 2
    y: 4
    pages:
      - decor: barrel
        interactions:
          - { type: examine, label: Search, dialog: search_water, actions: [{ giveItem: antidote }, { setFlag: searched_barrel_water }] }
      - when: { flag: searched_barrel_water }
        decor: barrel
        interactions:
          - { type: examine, label: Search, dialog: after_water }

  # Jars, barrels and crates along the houses: nothing (useful) inside, but they can be searched.
  - id: barrel_rain
    x: 3
    y: 1
    pages:
      - decor: barrel
        interactions:
          - { type: examine, label: Search, dialog: search_rainwater }

  - id: jar_empty_west
    x: 4
    y: 2
    pages:
      - decor: pot
        interactions:
          - { type: examine, label: Search, dialog: search_empty_jar }

  - id: crate_spice
    x: 12
    y: 1
    pages:
      - decor: crate
        interactions:
          - { type: examine, label: Search, dialog: search_spice_crate }

  - id: jar_oil
    x: 12
    y: 2
    pages:
      - decor: pot
        interactions:
          - { type: examine, label: Search, dialog: search_lamp_oil }
