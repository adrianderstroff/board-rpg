# MAGIC (with a star) is painted on the wall above the spell shop's door, facing the path
wallDecor:
  - { x: 2, y: 2, sign: magic, face: S, level: 6 }

spawns:
  from_forest: { x: 7, y: 10, dir: N }
  from_shop: { x: 2, y: 3, dir: S }

exits:
  - { x: 7, y: 11, dir: S, to: greenwood, spawn: from_elves, label: Greenwood River }
  - { x: 2, y: 2, dir: N, to: elvenglade_shop, spawn: from_town, label: Faelar's Glade Magic, door: true }

events:

  - id: sylwen
    x: 8
    y: 3
    states:
      idle: { npc: elf_elder, dir: S }
    on:
      - { on: interact, options: [{ type: talk, dialog: sylwen_talk }] }

  - id: lio
    x: 10
    y: 6
    states:
      idle: { npc: elf, dir: W, move: wander, wanderRadius: 3 }
    on:
      - { on: interact, options: [{ type: talk, dialog: lio_talk }] }

  - id: mirelle
    x: 5
    y: 8
    states:
      idle: { npc: elf_b, dir: E, move: wander, wanderRadius: 2 }
    on:
      - { on: interact, options: [{ type: talk, dialog: mirelle_talk }] }

  - id: moonwell
    x: 7
    y: 4
    states:
      idle: { decor: well }
    on:
      - on: interact
        options: [{ type: examine, label: Drink, dialog: moonwell_drink, actions: [{ healParty: true }] }]
on:
  - on: becomes
    when: { always: true }
    do: [{ dialog: elvenglade_enter }]
    once: true
    onceKey: elvenglade_enter#0
