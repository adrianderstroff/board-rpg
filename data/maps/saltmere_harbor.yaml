# Saltmere Harbor – peaceful start map (§18). The heroes arrive on the ship Gull.
# Grid +x = screen down-right, +y = screen down-left. Layers: see sandhollow.yaml.
name: Saltmere Harbor
kind: peaceful
chipset: desert
battleback: harbor
music: harbor

legend:
  terrain:
    "~": sea
    D: deck
    w: wood
    c: cobble
    p: stone_path
    g: grass
    r: rock
    A: adobe
    W: adobe_window
    O: adobe_door
  shapes:
    "^": { cut: [NW, NE] }
    "/": { cut: [NW] }
    "\\": { cut: [NE] }
  decor:
    M: mast
    B: bollard
    o: rope_coil
    N: net_rack
    L: lamp_post
    P: palm
    a: anchor
    x: crate
    b: barrel
    H: ship_wheel

layers:
  terrain: |
    ~~~~~~~rAAArAAAAAr
    ~~D~~~~cWOWcWOWWOr
    ~DDD~wwccccccccccr
    ~DDD~wwccccccccccr
    ~DDD~wwccccccggccr
    ~DDD~wwccccccggccr
    ~DDDwwwcccccccccpp
    ~DDD~wwccccccccccr
    ~DDD~wwcccAAAccccr
    ~DDD~wwcccOWAccccr
    ~~~~~wwccccccccccr
    ~~~~~~~rrrrrrrrrrr
  height: |
    000000024442444442
    002000014441444442
    022201111111111112
    022201111111111112
    022201111111111112
    022201111111111112
    022211111111111111
    022201111111111112
    022201111133311112
    033301111133311112
    000001111111111112
    000000022222222222
  # the Gull's bow: a point and two half cells cut along the diagonals (§5.9)
  shape: |
    ..................
    ..^...............
    ./.\..............
    ..................
  decor: |
    ..................
    ..................
    .........N........
    .....B............
    ..M.....L....P....
    ......o...........
    ..................
    ..M...............
    ..................
    ..H..B............
    ................a.
    ..................

spawns:
  start: { x: 3, y: 6, dir: E }
  from_forest: { x: 16, y: 6, dir: W }

exits:
  - { x: 17, y: 6, dir: E, to: greenwood, spawn: from_harbor, label: Greenwood River }

events:
  - id: harbor_intro
    x: 3
    y: 6
    states:
      idle: {}
    on:
      - on: becomes
        when: { always: true }
        do: [{ dialog: harbor_intro }]
        once: true
        onceKey: harbor_intro#0

  - id: captain
    x: 2
    y: 6
    states:
      idle: { npc: captain, dir: E }
    on:
      - { on: interact, when: { flag: monks_trial }, options: [{ type: talk, dialog: captain_isle_offer }] }
      - { on: interact, options: [{ type: talk, dialog: captain_talk }] }

  - id: sailor
    x: 6
    y: 7
    states:
      idle: { npc: sailor, dir: W, move: wander, wanderRadius: 2 }
    on:
      - { on: interact, options: [{ type: talk, dialog: sailor_talk }] }

  - id: dockhand
    x: 10
    y: 6
    states:
      idle: { npc: sailor_b, dir: S }
    on:
      - { on: interact, options: [{ type: talk, dialog: dockhand_talk }] }

  - id: fishwife
    x: 14
    y: 7
    states:
      idle: { npc: fishwife, dir: W, move: wander, wanderRadius: 2 }
    on:
      - { on: interact, options: [{ type: talk, dialog: fishwife_talk }] }

  # Barrels, jars and crates can be searched once (§18); some are empty.
  - id: barrel_herring
    x: 8
    y: 3
    states:
      idle: { decor: barrel }
    on:
      - on: interact
        when: { flag: searched_barrel_herring }
        options: [{ type: examine, label: Search, dialog: after_herring }]
      - on: interact
        options:
          - type: examine
            label: Search
            dialog: search_potion
            actions: [{ giveItem: potion }, { setFlag: searched_barrel_herring }]

  - id: barrel_fish
    x: 14
    y: 8
    states:
      idle: { decor: barrel }
    on:
      - on: interact
        when: { flag: searched_barrel_fish }
        options: [{ type: examine, label: Search, dialog: search_fish }]
      - on: interact
        options: [{ type: examine, label: Search, dialog: search_fish, actions: [{ setFlag: searched_barrel_fish }] }]

  - id: jar_coins
    x: 16
    y: 4
    states:
      idle: { decor: pot }
    on:
      - on: interact
        when: { flag: searched_jar_coins }
        options: [{ type: examine, label: Search, dialog: after_rum }]
      - on: interact
        options:
          - type: examine
            label: Search
            dialog: search_gold
            actions: [{ giveGold: 40 }, { setFlag: searched_jar_coins }]

  - id: jar_vial
    x: 9
    y: 9
    states:
      idle: { decor: pot }
    on:
      - on: interact
        when: { flag: searched_jar_vial }
        options: [{ type: examine, label: Search, dialog: after_wine }]
      - on: interact
        options:
          - type: examine
            label: Search
            dialog: search_ether
            actions: [{ giveItem: ether }, { setFlag: searched_jar_vial }]

  - id: jar_empty
    x: 12
    y: 3
    states:
      idle: { decor: pot }
    on:
      - on: interact
        when: { flag: searched_jar_empty }
        options: [{ type: examine, label: Search, dialog: search_sand }]
      - on: interact
        options: [{ type: examine, label: Search, dialog: search_sand, actions: [{ setFlag: searched_jar_empty }] }]

  - id: crate_dock
    x: 6
    y: 10
    states:
      idle: { decor: crate }
    on:
      - on: interact
        when: { flag: searched_crate_dock }
        options: [{ type: examine, label: Search, dialog: after_rope }]
      - on: interact
        options:
          - type: examine
            label: Search
            dialog: search_antidote
            actions: [{ giveItem: antidote }, { setFlag: searched_crate_dock }]

  - id: crate_ship
    x: 3
    y: 5
    states:
      idle: { decor: crate }
    on:
      - on: interact
        when: { flag: searched_crate_ship }
        options: [{ type: examine, label: Search, dialog: search_biscuits }]
      - on: interact
        options: [{ type: examine, label: Search, dialog: search_biscuits, actions: [{ setFlag: searched_crate_ship }] }]

  - id: barrel_tar
    x: 12
    y: 2
    states:
      idle: { decor: barrel }
    on:
      - on: interact
        when: { flag: searched_barrel_tar }
        options: [{ type: examine, label: Search, dialog: search_tar }]
      - on: interact
        options: [{ type: examine, label: Search, dialog: search_tar, actions: [{ setFlag: searched_barrel_tar }] }]

  - id: crate_nails
    x: 15
    y: 2
    states:
      idle: { decor: crate }
    on:
      - on: interact
        when: { flag: searched_crate_nails }
        options: [{ type: examine, label: Search, dialog: search_nails }]
      - on: interact
        options: [{ type: examine, label: Search, dialog: search_nails, actions: [{ setFlag: searched_crate_nails }] }]

  - id: crate_empty
    x: 16
    y: 2
    states:
      idle: { decor: crate }
    on:
      - on: interact
        when: { flag: searched_crate_empty }
        options: [{ type: examine, label: Search, dialog: search_empty_crate }]
      - on: interact
        options:
          - type: examine
            label: Search
            dialog: search_empty_crate
            actions: [{ setFlag: searched_crate_empty }]
