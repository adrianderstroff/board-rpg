# Saltmere Harbor – peaceful start map (§18). The heroes arrive on the ship Gull.
# Grid +x = screen down-right, +y = screen down-left. Layers: see sandhollow.yaml.
name: Saltmere Harbor
kind: peaceful
chipset: desert
battleback: harbor
music: harbor

legend:
  terrain:
    "~": sea
    D: deck
    w: wood
    c: cobble
    p: stone_path
    g: grass
    r: rock
    A: adobe
    W: adobe_window
    O: adobe_door
  shapes:
    "^": { cut: [NW, NE] }
    "/": { cut: [NW] }
    "\\": { cut: [NE] }
  decor:
    M: mast
    B: bollard
    o: rope_coil
    N: net_rack
    L: lamp_post
    P: palm
    a: anchor
    x: crate
    b: barrel
    H: ship_wheel

layers:
  terrain: |
    ~~~~~~~rAAArAAAAAr
    ~~D~~~~cWOWcWOWWOr
    ~DDD~wwccccccccccr
    ~DDD~wwccccccccccr
    ~DDD~wwccccccggccr
    ~DDD~wwccccccggccr
    ~DDDwwwcccccccccpp
    ~DDD~wwccccccccccr
    ~DDD~wwcccAAAccccr
    ~DDD~wwcccOWAccccr
    ~~~~~wwccccccccccr
    ~~~~~~~rrrrrrrrrrr
  height: |
    000000024442444442
    002000014441444442
    022201111111111112
    022201111111111112
    022201111111111112
    022201111111111112
    022211111111111111
    022201111111111112
    022201111133311112
    033301111133311112
    000001111111111112
    000000022222222222
  # the Gull's bow: a point and two half cells cut along the diagonals (§5.9)
  shape: |
    ..................
    ..^...............
    ./.\..............
    ..................
  decor: |
    ..................
    ..................
    .........N........
    .....B............
    ..M.....L....P....
    ......o...........
    ..................
    ..M...............
    ..................
    ..H..B............
    ................a.
    ..................

spawns:
  start: { x: 3, y: 6, dir: E }
  from_forest: { x: 16, y: 6, dir: W }

exits:
  - { x: 17, y: 6, dir: E, to: greenwood, spawn: from_harbor, label: Greenwood River }

events:
  - id: harbor_intro
    x: 3
    y: 6
    pages:
      - { trigger: auto, dialog: harbor_intro }

  - id: captain
    x: 2
    y: 6
    pages:
      - { npc: captain, dir: E, dialog: captain_talk }
      - { when: { flag: monks_trial }, npc: captain, dir: E, dialog: captain_isle_offer }

  - id: sailor
    x: 6
    y: 7
    pages:
      - { npc: sailor, dir: W, move: wander, wanderRadius: 2, dialog: sailor_talk }

  - id: dockhand
    x: 10
    y: 6
    pages:
      - { npc: sailor_b, dir: S, dialog: dockhand_talk }

  - id: fishwife
    x: 14
    y: 7
    pages:
      - { npc: fishwife, dir: W, move: wander, wanderRadius: 2, dialog: fishwife_talk }

  # Barrels, jars and crates can be searched once (§18); some are empty.
  - id: barrel_herring
    x: 8
    y: 3
    pages:
      - decor: barrel
        interactions:
          - { type: examine, label: Search, dialog: search_potion, actions: [{ giveItem: potion }, { setFlag: searched_barrel_herring }] }
      - when: { flag: searched_barrel_herring }
        decor: barrel
        interactions:
          - { type: examine, label: Search, dialog: after_herring }

  - id: barrel_fish
    x: 14
    y: 8
    pages:
      - decor: barrel
        interactions:
          - { type: examine, label: Search, dialog: search_fish, actions: [{ setFlag: searched_barrel_fish }] }
      - when: { flag: searched_barrel_fish }
        decor: barrel
        interactions:
          - { type: examine, label: Search, dialog: search_fish }

  - id: jar_coins
    x: 16
    y: 4
    pages:
      - decor: pot
        interactions:
          - { type: examine, label: Search, dialog: search_gold, actions: [{ giveGold: 40 }, { setFlag: searched_jar_coins }] }
      - when: { flag: searched_jar_coins }
        decor: pot
        interactions:
          - { type: examine, label: Search, dialog: after_rum }

  - id: jar_vial
    x: 9
    y: 9
    pages:
      - decor: pot
        interactions:
          - { type: examine, label: Search, dialog: search_ether, actions: [{ giveItem: ether }, { setFlag: searched_jar_vial }] }
      - when: { flag: searched_jar_vial }
        decor: pot
        interactions:
          - { type: examine, label: Search, dialog: after_wine }

  - id: jar_empty
    x: 12
    y: 3
    pages:
      - decor: pot
        interactions:
          - { type: examine, label: Search, dialog: search_sand, actions: [{ setFlag: searched_jar_empty }] }
      - when: { flag: searched_jar_empty }
        decor: pot
        interactions:
          - { type: examine, label: Search, dialog: search_sand }

  - id: crate_dock
    x: 6
    y: 10
    pages:
      - decor: crate
        interactions:
          - { type: examine, label: Search, dialog: search_antidote, actions: [{ giveItem: antidote }, { setFlag: searched_crate_dock }] }
      - when: { flag: searched_crate_dock }
        decor: crate
        interactions:
          - { type: examine, label: Search, dialog: after_rope }

  - id: crate_ship
    x: 3
    y: 5
    pages:
      - decor: crate
        interactions:
          - { type: examine, label: Search, dialog: search_biscuits, actions: [{ setFlag: searched_crate_ship }] }
      - when: { flag: searched_crate_ship }
        decor: crate
        interactions:
          - { type: examine, label: Search, dialog: search_biscuits }

  - id: barrel_tar
    x: 12
    y: 2
    pages:
      - decor: barrel
        interactions:
          - { type: examine, label: Search, dialog: search_tar, actions: [{ setFlag: searched_barrel_tar }] }
      - when: { flag: searched_barrel_tar }
        decor: barrel
        interactions:
          - { type: examine, label: Search, dialog: search_tar }

  - id: crate_nails
    x: 15
    y: 2
    pages:
      - decor: crate
        interactions:
          - { type: examine, label: Search, dialog: search_nails, actions: [{ setFlag: searched_crate_nails }] }
      - when: { flag: searched_crate_nails }
        decor: crate
        interactions:
          - { type: examine, label: Search, dialog: search_nails }

  - id: crate_empty
    x: 16
    y: 2
    pages:
      - decor: crate
        interactions:
          - { type: examine, label: Search, dialog: search_empty_crate, actions: [{ setFlag: searched_crate_empty }] }
      - when: { flag: searched_crate_empty }
        decor: crate
        interactions:
          - { type: examine, label: Search, dialog: search_empty_crate }
