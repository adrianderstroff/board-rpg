# Sunken Ruins – wild map (§18): dormant skeletons among harmless remains, ancient traps and
# an invisible chest (§7.5). Kit's Discover senses and uncovers hidden things.
name: Sunken Ruins
kind: wild
chipset: desert
battleback: ruins
music: ruins

legend:
  terrain:
    r: rock
    s: sand
    u: ruin_floor
    X: ruin_wall
    p: stone_path
  decor:
    K: skeleton
    I: pillar
    i: pillar_broken
    o: rubble
    c: cactus_small
    C: cactus

layers:
  terrain: |
    rrrrrsssssssssssrrrr
    rrsssuuuXXXuuussssrr
    rssuuuuuXuXuuuuusssr
    rsuuXXuuuuuuXXuuusss
    ssuuXuuuuuuuuXuuussr
    ssuuuuuuXXXuuuuuussr
    pssuuuuuuuuuuuuuusss
    rsuuuuuuuuuuuuuuuupp
    rsuuXuuuXXuuuXuuussr
    rssuXuuuuuuuuXuusssr
    rsssuuuuuuuuuuussssr
    rsssuuuXXuuuuusssrrr
    rrssssssssssssssrrrr
    rrrrrrssssssrrrrrrrr
  height: |
    33333000000000003333
    33000111333111000033
    30011111313111110003
    30113311111133111000
    00113111111113111003
    00111111333111111003
    00011111111111111000
    30111111111111111100
    30113111331113111003
    30013111111113110003
    30001111111111100003
    30001113311111000333
    33000000000000003333
    33333300000033333333
