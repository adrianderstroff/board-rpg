spawns:
  from_forest: { x: 1, y: 6, dir: E }
  from_sandhollow: { x: 18, y: 7, dir: W }

exits:
  - { x: 0, y: 6, dir: W, to: greenwood, spawn: from_ruins, label: Greenwood River }
  - { x: 19, y: 7, dir: E, to: sandhollow, spawn: from_ruins, label: Sandhollow }

# Dormant skeletons look exactly like the remains (K) around them (§7.5).
enemies:
  - { id: bones_a, enemy: skeleton, x: 5, y: 4, dir: S }
  - { id: bones_b, enemy: skeleton, x: 11, y: 9, dir: N }
  - { id: bones_c, enemy: skeleton, x: 16, y: 5, dir: W }

# Ancient traps: invisible, stop heroes walking over them (§7.5).
traps:
  - { id: trap_a, x: 8, y: 6, damage: 8, status: stuck }
  - { id: trap_b, x: 13, y: 7, damage: 8, status: stuck }
  - { id: trap_c, x: 4, y: 7, damage: 8, status: stuck }

events:

  - id: hidden_chest
    x: 10
    y: 11
    hidden: true
    states:
      chest_closed: { decor: chest_closed }
      chest_open: { decor: chest_open }
    on:
      - on: becomes
        when: { not: { flag: ruins_chest_open } }
        do: [{ setState: { event: hidden_chest, state: chest_closed } }]
      - on: becomes
        when: { flag: ruins_chest_open }
        do: [{ setState: { event: hidden_chest, state: chest_open } }]
      - on: interact
        when: { not: { flag: ruins_chest_open } }
        options:
          - type: examine
            label: Open
            dialog: ruins_chest
            actions: [{ giveItem: speed_anklet }, { setFlag: ruins_chest_open }]
on:
  - { on: becomes, when: { always: true }, do: [{ dialog: ruins_enter }], once: true, onceKey: ruins_enter#0 }
