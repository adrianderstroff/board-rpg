# Global rules and the new-game setup. See docs/game-design.md.
title: Board RPG

start:
  map: sandhollow
  spawn: start
  party: [aldric, mira, kit, tarek]
  gold: 300
  items:
    potion: 3
    antidote: 2
    phoenix_feather: 1
    fire_bomb: 1
  quest: road_to_oasis

maxLevel: 50
maxPartySize: 4

# EXP needed to reach level L = floor(expBase * (L-1)^expExponent)
expBase: 12
expExponent: 2.1

# Damage = ATK * power * damageFactor * defenseScale / (defenseScale + DEF)   (§12.3)
defenseScale: 24
damageFactor: 1.4
critChance: 0.05
hitChance: 0.95

firstStrikeChance: 0.25
ambushChance: 0.25

innPricePerHero: 10

# Music tracks (public/assets/audio/music/<id>.wav). Maps choose their own via `music:`.
music:
  title: title
  battle: battle
  boss: boss
sellRatio: 0.5
boardBurnMinHp: 1
