# Dialogs of the journey inland (§18): Saltmere Harbor, Greenwood River, Elvenglade, Sunken Ruins.
# Format: see sandhollow.yaml.

# ---------------- Saltmere Harbor ----------------
harbor_intro:
  - speaker: captain
    say: "Land ho! *Saltmere Harbor*, as promised.|\nFrom here on it's your own feet, I'm afraid."
  - speaker: mira
    say: "Sandhollow lies beyond the *Greenwood* and the old ruins, doesn't it?"
  - speaker: captain
    say: "Aye. Follow the road *east*.|\nAnd have a look around the docks – sailors forget all sorts of things in barrels."
  - speaker: ""
    say: "Tip: with no enemies around you explore freely – tap a cell to walk there,\ntap your party for its commands. Barrels and jars can be *searched*."

captain_talk:
  - say: "Fair winds, friends. The *Gull* sails again at the new moon.|\nIf the desert spits you out, you know where to find me."

sailor_talk:
  - say: "Ever seen an elf? Tiny folk, live up north in the *Greenwood*.|\nThey say they can ~freeze rivers~!"

dockhand_talk:
  - say: "Barrels, jars, crates... half the cargo in this harbor is forgotten.|\nHelp yourselves. The harbormaster won't notice."
  - speaker: kit
    say: "Music to my ears."

fishwife_talk:
  - say: "Fresh fish! ...Oh, you're travelers.|\nThe road east crosses a *river* – there's been no bridge since the spring floods."

search_potion:
  - speaker: ""
    say: "Under the salted herring: a *Potion*!"
search_ether:
  - speaker: ""
    say: "A sealed vial rests at the bottom of the jar – an *Ether*!"
search_gold:
  - speaker: ""
    say: "Coins rattle in the jar. *40 gold*!"
search_antidote:
  - speaker: ""
    say: "Among the ropes lies an *Antidote*."
search_fish:
  - speaker: ""
    say: "Salted fish. ~Lots~ of salted fish."
search_biscuits:
  - speaker: ""
    say: "Ship's biscuits. Hard as rock."
search_sand:
  - speaker: ""
    say: "Only sand and a dead crab."

# ---------------- Greenwood River ----------------
greenwood_enter:
  - speaker: kit
    say: "Trees! Real, green trees!|\nI grew up in the bazaar – I've only ever seen palms."
  - speaker: aldric
    say: "Keep your eyes open. The road runs *east* to the river."

sign_river:
  - speaker: Sign
    say: "[c=gold]Greenwood Ford[/c]\nThe bridge was lost in the spring floods.\nNo crossing until the elves ^freeze^ the river in winter."

scout_talk:
  - say: "Tall folk at the river? You won't swim that – it's deep and cold."
  - say: "Our mage *Faelar* in *Elvenglade* – north along the path – sells the *Ice* spell.|\nFreeze the water and walk across. Three steps wide, enough for a whole party."
  - speaker: mira
    say: "Ice on running water... that would be a spell worth learning."
  - say: "And beyond the river, the old stairs to the desert are blocked by *ironthorn cacti*.|\nNo blade gets through them. But dry as they are, they ~burn~ like straw."

# ---------------- Elvenglade ----------------
elvenglade_enter:
  - speaker: tarek
    say: "A village... in the trees. And everyone here is half my height."
  - speaker: ""
    say: "*Elvenglade*, home of the small elves of the Greenwood."

sylwen_talk:
  - say: "Welcome, tall ones. Scout Tamsin says you wish to cross the river."
  - say: "Learn the *Ice* spell from Faelar and cast it on the water:|\nit freezes a square three steps wide, enough for a whole party."
  - say: "Beyond it, *Fire* clears the cacti from the old stairs.|\nBut mind you – fire *spreads* to every plant next to it, and over grass."
  - say: "The *moonwell* here heals every wound. Drink before you go."

faelar_talk:
  - say: "Scrolls, ethers and frost. Read a scroll and a mage knows the spell forever."
  - say: "*Ice* is the one you want, I think. It even freezes running water.|\nFire melts it again, of course – don't mix them up on the river!"

lio_talk:
  - say: "You're so ~tall~! Do you bump your heads on clouds?"

mirelle_talk:
  - say: "The moonwell glows brightest at night.|\nIts water heals anything – even a thief's bad manners."
  - speaker: kit
    say: "^Hey!^"

moonwell_drink:
  - speaker: ""
    say: "The water glows softly as you drink.| Everyone feels *refreshed*."

# ---------------- Sunken Ruins ----------------
ruins_enter:
  - speaker: kit
    say: "Bones... everywhere.| Some of these don't look *old* enough."
  - speaker: tarek
    say: "Old temples hide old traps. Step carefully."
  - speaker: ""
    say: "Tip: Kit's *Discover* reveals everything hidden close by – traps, lost things,\nand whatever only pretends to be dead. *Defuse* turns a trap into a Snare."

ruins_chest:
  - speaker: ""
    say: "Found a *Speed Anklet*!"

# Searching again: what's (still) inside
after_herring:
  - speaker: ""
    say: "Only salted herring left. The smell follows you for a while."
after_rum:
  - speaker: ""
    say: "An empty jar. It still reeks of cheap sailor's rum."
after_wine:
  - speaker: ""
    say: "Just a sticky film of old, *very* strong wine at the bottom."
after_rope:
  - speaker: ""
    say: "Coils of tarred rope. Nothing else."
search_tar:
  - speaker: ""
    say: "Thick black tar for the ship's seams. It sticks to everything."
search_nails:
  - speaker: ""
    say: "Rusty nails and a broken hammer. Nothing useful."
search_empty_crate:
  - speaker: ""
    say: "Empty – just straw and the strong stench of not-so-fresh fish."
