# Dialogs (§9). A dialog is a list of nodes: say / choice / do / if / goto / end.
# `speaker` = npc id, hero id, or plain name (defaults to the NPC you talk to).
# Markup: *highlight*, ~wave~, ^shake^, [c=red]..[/c], [s=2]..[/s], [rainbow]..[/rainbow],
#         [spd=0.5]..[/spd], | pause, [p=800] long pause, {gold} {hero} variables.

elder_intro:
  - say: "Ah, travelers! Welcome to *Sandhollow*.|\nForgive an old man for skipping the pleasantries."
  - say: "The road east to the *Mirage Oasis* is overrun.|\nAn ^Emperor Scorpion^ has made the dunes its kingdom."
  - speaker: aldric
    say: "We are headed to the oasis ourselves. We'll clear the road."
  - say: "~Bless you~.| I'll tell the guard to open the *east gate*.\nCome back to me once the beast is slain."
  - do: [{ setFlag: gate_open }]

elder_waiting:
  - say: "The *Emperor Scorpion* waits in the dunes, east of the gate.|\nIts shell is hard, but they say it hates the [c=cyan]cold[/c]."

elder_report:
  - say: "You... you did it! The dunes are free!"
  - if: { flag: dunes_cleansed }
    then: elder_report_bonus
  - say: "Take this for your trouble. Sandhollow will not forget you."
  - do: [{ giveGold: 200 }, { giveItem: hi_potion }, { setFlag: reported_to_elder }]

elder_report_bonus:
  - say: "And not a single scorpion or condor left?| [rainbow]Remarkable![/rainbow]\nTake this as well – my old *Flame Blade*."
  - do: [{ giveGold: 200 }, { giveItem: hi_potion }, { giveItem: flame_blade }, { setFlag: reported_to_elder }]

elder_after:
  - say: "The road beyond the dunes is still long.|\nRest well before you go on. [c=grey](End of the demo – thank you for playing!)[/c]"

guard_closed:
  - say: "The *east gate* is closed. Orders of the Elder.\nNobody goes into the dunes while the ^Emperor^ lives."

guard_open:
  - say: "The Elder says you're going after the beast.|\nWatch out for *quicksand* – you'll get stuck."

smith_talk:
  - say: "Steel for the dunes? A good blade and thick armor, that's all you need!"
  - speaker: kit
    say: "And legs to run with.|"
  - say: "^Hah!^ Legs don't block claws, kid."

merchant_talk:
  - say: "Scorpion stings are nasty. Keep *Antidotes* on you!"
  - choice:
      - text: "Any other advice?"
        goto: merchant_advice
      - text: "Thanks."

merchant_advice:
  - say: "Condors fly over anything, and they hate *thunder*.\nScorpions hate the [c=cyan]cold[/c]."

mage_talk:
  - say: "Scrolls, bombs and rods. Knowledge for a price."
  - say: "Throw a *Fire Bomb* on the board and the sand itself burns.|\nThings that walk through fire ~regret it~."

inn_talk:
  - say: "The Sleeping Camel! A soft bed heals any wound.|\nEven the ones that knocked you flat."

nia_ask:
  - say: "Hey! You're going into the dunes? I... might have lost my *charm* out there."
  - choice:
      - text: "We'll look for it."
        do: [{ startQuest: { id: nias_charm, activate: false } }]
        goto: nia_ask_yes
      - text: "Not now."
        goto: nia_ask_no

nia_ask_yes:
  - say: "~Really?~ It's a little sun made of clay. I left it near the *oasis*!"

nia_ask_no:
  - say: "Oh... okay."

nia_waiting:
  - say: "Did you find my charm? It should be near the *oasis* in the dunes."

nia_thanks:
  - say: "My *charm*! You found it!| [rainbow]Thank you thank you![/rainbow]"
  - say: "Here, take this. Mom says feathers bring luck."
  - do:
      - { takeItem: village_charm }
      - { giveItem: phoenix_feather }
      - { setFlag: charm_returned }
      - { completeQuest: nias_charm }

nia_happy:
  - say: "I'll never go into the dunes alone again.| ...Probably."

villager_1:
  - say: "Water from the well tastes like sand this year."

villager_2:
  - say: "My husband's caravan hasn't come back from the oasis road..."

villager_2_after:
  - say: "The road is safe? Then he'll come home soon! ~Thank you~."

sign_east:
  - speaker: Sign
    say: "[c=gold]East: Scorpion Dunes[/c]\nDanger! Travel only in groups."

chest_charm:
  - speaker: ""
    say: "Found the *Village Charm*!"

dunes_enter:
  - speaker: aldric
    say: "The *Scorpion Dunes*. Heat shimmers over the sand."
  - speaker: ""
    say: "Tip: moving onto an enemy starts a battle. Stay together – or split up to surround them."

trader_help:
  - say: "^Shh!^ The scorpions can't see me behind the palms... I hope."
  - say: "Enemies will attack anyone out here, not just you. If you keep them busy, I'll make it worth your while."
  - if: { questDone: clear_dunes }
    then: trader_reward

trader_reward:
  - say: "The Emperor is dead? Then I can go home! Take these, friend."
  - do: [{ giveItem: { id: ether, count: 2 } }, { setFlag: trader_thanked }]

trader_after:
  - say: "Safe travels! I'll tell the whole bazaar about you."
